*{box-sizing:border-box}body{margin:0;background:#e9e9ed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#151515}button{font:inherit;cursor:pointer;border:0}#phone{position:relative;margin:16px auto;width:min(100%,410px);height:min(850px,calc(100dvh - 32px));min-height:570px;overflow:hidden;border-radius:35px;box-shadow:0 20px 65px #0003;background:#fff}.wall{background:radial-gradient(ellipse at 78% 67%,#745069 0,transparent 55%),radial-gradient(ellipse at 15% 16%,#25447b 0,transparent 62%),linear-gradient(150deg,#192442,#253e60 75%,#312942);color:white}.screen{position:absolute;inset:0;display:none;overflow:auto;padding-bottom:48px}.screen.active{display:block}.status{height:55px;display:flex;align-items:center;justify-content:space-between;padding:8px 28px;font-size:15px;font-weight:650;position:relative;z-index:3}.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:115px;height:5px;background:currentColor;border-radius:8px;z-index:15;opacity:.85;cursor:pointer}.wall .homebar{color:white}.light .homebar{color:black}.locktime{text-align:center;margin-top:38px}.locktime .date{font-size:19px}.locktime .clock{font-size:83px;font-weight:200;letter-spacing:-5px}.notif{margin:20px 15px;padding:13px;border-radius:20px;background:#ffffffa8;color:#111;backdrop-filter:blur(12px);display:flex;gap:12px;align-items:center;text-align:left;width:calc(100% - 30px)}.notif b{display:block}.notif small{display:block;color:#50505a}.lockbottom{position:absolute;bottom:42px;width:100%;text-align:center;color:#c6c9d3}.pass-title{text-align:center;margin:76px 0 23px;font-size:23px}.dots{display:flex;justify-content:center;gap:20px}.dot{width:14px;height:14px;border:1.5px solid white;border-radius:50%}.dot.filled{background:white}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:17px 20px;width:265px;margin:70px auto 0}.key{width:73px;height:73px;border-radius:50%;background:#ffffff36;color:white;font-size:36px;font-weight:300 (()=>{const root=document.querySelector('#phone');if(root.dataset.ready)return;root.dataset.ready='1';let page='lock',pin='',app='',selectedDay=25,month=10,photoIndex=0;const $=s=>root.querySelector(s),show=id=>{root.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id));page=id};const apps=[['calendar','📅','行事曆','#fff'],['photos','🌸','照片','#fff'],['clock','◷','時鐘','#222'],['maps','🗺️','地圖','#fff'],['notes','📝','備忘錄','#ffdd53'],['kakao','TALK','KakaoTalk','#ffe500'],['music','♫','音樂','#f9b4c3'],['settings','⚙️','設定','#cdd0d8']];const dock=[['phone','☎','電話','#2bc85c'],['browser','🧭','Safari','#fff'],['messages','💬','訊息','#2bc85c'],['camera','📷','相機','#d7d8dc']];function icon(x){return `<button class="appicon" data-app="${x[0]}"><span class="tile" style="background:${x[3]};${x[0]==='kakao'?'font-size:16px;font-weight:900':''}">${x[1]}${x[0]==='kakao'?'<i class="badge">4</i>':''}</span><span>${x[2]}</span></button>`}$('#icons').innerHTML=apps.map(icon).join('');$('#dock').innerHTML=dock.map(icon).join('');$('#keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,''].map(n=>n===''?'<span></span>':`<button class="key" data-digit="${n}">${n}</button>`).join('');function dots(){$('#dots').innerHTML=Array.from({length:4},(_,i)=>`<span class="dot ${i<pin.length?'filled':''}"></span>`).join('')}dots();function digit(n){if(pin.length>=4)return;pin+=n;dots();if(pin.length===4){setTimeout(()=>{if(pin==='0313'){show('home')}else{$('#passmsg').textContent='密碼錯誤，請再試一次';setTimeout(()=>$('#passmsg').textContent='',1300)}pin='';dots()},220)}}const people=[['TXT 團體聊天室','🐰','연준：有人看到杋圭嗎ㅋㅋ'],['수빈 🐰','🐰','杋圭啊，你的手機到底放哪裡了？'],['연준 🦊','🦊','記得回我訊息！'],['태현 🐿️','🐿️','哥，你的耳機在我這裡'],['휴닝카이 🐧','🐧','ㅋㅋㅋㅋㅋㅋ'],['媽媽 ❤️','🌷','記得吃飯，別太晚睡']];const conv=[['TXT 團體聊天室',[['연준','有人看到杋圭嗎ㅋㅋ'],['수빈','剛剛還在這裡啊'],['태현','他是不是又把手機弄丟了'],['휴닝카이','ㅋㅋㅋㅋㅋㅋ'],['我','呀！！我只是去買飲料！']]],['수빈 🐰',[['수빈','杋圭啊，你的手機到底放哪裡了？'],['我','我也在找ㅠㅠ'],['수빈','先回宿舍，我們一起找']]],['연준 🦊',[['연준','記得回我訊息！'],['我','知道啦ㅋㅋ']]],['태현 🐿️',[['태현','哥，你的耳機在我這裡'],['我','啊！謝謝你']]],['휴닝카이 🐧',[['휴닝카이','ㅋㅋㅋㅋㅋㅋ'],['我','你在笑什麼！！']]],['媽媽 ❤️',[['媽媽','記得吃飯，別太晚睡'],['我','好～❤️']]]];let notes=[['今天的心情','練習結束後，想聽一首很安靜的歌。\n\n明天也要加油。🐻'],['想做的事','🎸 練吉他\n📷 拍天空\n🍜 和成員一起吃飯\n💤 好好睡覺'],['秘密清單','1. 找回耳機\n2. 回秀彬的訊息\n3. 記得手機放在哪裡……']];function head(title,back='home'){return `<div class="apphead"><button class="back" data-${back==='home'?'action="home"':'app="'+back+'"'}>‹ 返回</button><b>${title}</b><span style="width:45px"></span></div>`}function open(name,arg){app=name;show('app');const b=$('#appbody');if(name==='kakao'){b.innerHTML=`<div class="apphead"><h1>聊天</h1><span>⌕　⊕</span></div><div class="list">${people.map((p,i)=>`<button class="row" data-chat="${i}"><span class="avatar">${p[1]}</span><span class="details"><b>${p[0]}</b><p>${p[2]}</p></span><time>21:${10-i}</time></button>`).join('')}</div><div class="fiction">所有對話均為虛構粉絲創作</div>`}else if(name==='chat'){let c=conv[arg];b.innerHTML=`${head(c[0],'kakao')}<div class="chatlog">${c[1].map(m=>`<div class="bubble ${m[0]==='我'?'mine':''}">${m[0]==='我'?'':`<small>${m[0]}</small><br>`}${m[1]}</div>`).join('')}</div><div class="chatfooter">僅供閱讀的虛構對話 💬</div>`;$('#app').style.background='#b7c8d7'}else if(name==='notes'){b.innerHTML=`<div class="apphead"><h1>備忘錄</h1><span>✎</span></div>${notes.map((n,i)=>`<button class="note" data-note="${i}"><strong>${n[0]}</strong><small>${n[1].slice(0,32)}</small></button>`).join('')}`}else if(name==='note'){b.innerHTML=head('備忘錄','notes')+`<div class="content"><h2>${notes[arg][0]}</h2><p style="white-space:pre-line">${notes[arg][1]}</p></div>`}else if(name==='photos'){b.innerHTML=`<div class="apphead"><h1>圖庫</h1><span>選擇</span></div><div class="content"><b>2026年10月</b></div><div class="photo-grid">${['☁️','🐻','🎸','🌙','🌷','📸','☕','🌌','🎧','🍀','💙','⭐'].map((x,i)=>`<button class="photo" data-photo="${i}">${x}</button>`).join('')}</div><div class="fiction">目前為示意相簿，可替換成你提供的照片</div>`}else if(name==='photo'){b.innerHTML=head('照片','photos')+`<div class="center" style="margin-top:70px;font-size:130px">${['☁️','🐻','🎸','🌙','🌷','📸','☕','🌌','🎧','🍀','💙','⭐'][arg]}</div><p class="center muted">2026年10月 · 示意照片</p><div class="center"><button class="back" data-photo="${(Number(arg)+11)%12}">‹ 上一張</button>　<button class="back" data-photo="${(Number(arg)+1)%12}">下一張 ›</button></div>`}else if(name==='calendar'){let days=new Date(2026,month,0).getDate(),offset=new Date(2026,month-1,1).getDay();b.innerHTML=`${head('行事曆')}<div class="calendar-title"><button data-month="-1">‹</button><h1>2026年${month}月</h1><button data-month="1">›</button></div><div class="calendargrid">${'日一二三四五六'.split('').map(x=>`<b class="muted">${x}</b>`).join('')}${Array.from({length:offset},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>`<button class="day ${selectedDay===i+1?'selected':''}" data-day="${i+1}">${i+1}</button>`).join('')}</div><div class="content"><hr><h3>${month}月${selectedDay}日</h3><div class="pill">${month===10&&selectedDay===25?'🐻 休息日 · 聽歌、練吉他':selectedDay===13?'🎂 特別的日子 ✨':'沒有安排的行程'}</div></div>`}else if(name==='settings'){b.innerHTML=head('設定')+`<div class="settings"><div class="pill">🐻　BEOMGYU'S PHONE<br><small class="muted">Fan-made fictional experience</small></div><button data-action="lock">🔒　鎖定手機</button><button data-app="about">ℹ️　關於這個作品</button></div>`}else if(name==='music'){b.innerHTML=head('音樂')+`<div class="content center"><div style="font-size:100px;margin:45px 0">🎸</div><h2>BEOMGYU's playlist</h2><p>TXT · 夢幻播放清單</p><button class="pill" id="playmusic">▶ 播放示意</button><p id="musicstatus" class="muted">此版本尚未接入音訊檔案</p></div>`}else if(name==='messages'||name==='phone'){b.innerHTML=head(name==='phone'?'電話':'訊息')+`<div class="list">${people.slice(0,4).map((p,i)=>`<button class="row" data-chat="${i}"><span class="avatar">${p[1]}</span><span class="details"><b>${p[0]}</b><p>${p[2]}</p></span></button>`).join('')}</div>`}else{let text={weather:'首爾 · 16° · 多雲',clock:'21:13 · 首爾時間',maps:'📍 首爾 · 地圖示意',browser:'Safari · 書籤',camera:'📷 相機展示模式',about:'這是虛構的 TXT 粉絲互動作品，並非崔杋圭真實手機或私人資訊。'};b.innerHTML=head(name)+`<div class="content center"><h2>${text[name]||name}</h2><p class="muted">互動展示頁面</p></div>`}if(name!=='chat')$('#app').style.background='#fff';}root.addEventListener('click',e=>{const t=e.target.closest('button,[data-action],[data-digit]');if(!t)return;if(t.dataset.action==='unlock'){show('pass');return}if(t.dataset.action==='lock'){pin='';dots();show('lock');return}if(t.dataset.action==='home'){show('home');return}if(t.dataset.digit!==undefined){digit(t.dataset.digit);return}if(t.id==='delete'){pin=pin.slice(0,-1);dots();return}if(t.dataset.app){open(t.dataset.app);return}if(t.dataset.chat!==undefined){open('chat',Number(t.dataset.chat));return}if(t.dataset.note!==undefined){open('note',Number(t.dataset.note));return}if(t.dataset.photo!==undefined){open('photo',Number(t.dataset.photo));return}if(t.dataset.day){selectedDay=Number(t.dataset.day);open('calendar');return}if(t.dataset.month){month=Math.min(12,Math.max(1,month+Number(t.dataset.month)));selectedDay=1;open('calendar');return}if(t.id==='playmusic'){$('#musicstatus').textContent='🎵 播放器展示中；加入合法音檔後即可播放';return}});let startY=0;$('#lock').addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});$('#lock').addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>45)show('pass')},{passive:true});})();
